<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MHB battle_ss_2テストランチャー</title>
    <script>
      if (location.protocol === "file:") {
        location.replace("http://127.0.0.1:8765/test-saves/launch-battle-ss2-test.html");
      }
    </script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #111; font-family: sans-serif; }
      #toolbar { box-sizing: border-box; height: 52px; padding: 8px 16px; background: #fff; }
      button { padding: 7px 16px; font: inherit; }
      #status { margin-left: 12px; font-weight: 700; }
      iframe { display: block; width: 100%; height: calc(100% - 52px); border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="start" type="button">battle_ss_2直前から開始</button>
      <span id="status">既存セーブは変更されません。</span>
    </div>
    <iframe id="game" src="../" title="Monster Hunter Battle"></iframe>
    <script>
      const startButton = document.querySelector("#start");
      const status = document.querySelector("#status");
      const game = document.querySelector("#game");

      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        status.textContent = "読み込み中...";
        try {
          const response = await fetch("./battle_ss_2_ready.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const saveData = await response.json();
          const gameWindow = game.contentWindow;
          if (!gameWindow?.applySaveDataFromRaw) throw new Error("ゲームの読み込みが完了していません");
          const result = gameWindow.applySaveDataFromRaw(JSON.stringify(saveData));
          if (!result?.ok) throw new Error(result?.error || "セーブ形式が正しくありません");
          gameWindow.initializeSaveDataParty({ persist: false });
          gameWindow.refreshProgressViews();
          await gameWindow.startStoryMode();
          gameWindow.showStoryTravel2({ focus: true });
          status.textContent = "テストセーブを一時ロードしました。向かいの島へ進めます。";
          game.focus();
        } catch (error) {
          status.textContent = `読み込みに失敗しました: ${error}`;
          startButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
